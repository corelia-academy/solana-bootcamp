name: module-05 LiteSVM tests

on:
  push:
    branches: [main]
    paths:
      - "projects/pda-counter/final/**"
      - ".github/workflows/module-05-litesvm.yml"
  pull_request:
    paths:
      - "projects/pda-counter/final/**"
      - ".github/workflows/module-05-litesvm.yml"
  workflow_dispatch:

concurrency:
  group: module-05-litesvm-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.87.0"
  SOLANA_VERSION: "3.0.10"
  ANCHOR_VERSION: "0.31.1"
  NODE_VERSION: "20"
  LAB_DIR: projects/pda-counter/final

jobs:
  litesvm:
    name: LiteSVM in-process suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.LAB_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo build for lab
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.LAB_DIR }} -> target
          shared-key: module-05

      - name: Cache Solana install
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        if: steps.solana-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Verify Solana
        run: solana --version
        working-directory: .

      - name: Cache anchor-cli binary
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }}
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: cargo install --locked --version ${{ env.ANCHOR_VERSION }} anchor-cli

      - name: Verify Anchor
        run: anchor --version
        working-directory: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.LAB_DIR }}/pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Anchor build (produces .so + IDL that LiteSVM loads)
        run: anchor build

      - name: Run LiteSVM tests
        run: pnpm run test:litesvm
